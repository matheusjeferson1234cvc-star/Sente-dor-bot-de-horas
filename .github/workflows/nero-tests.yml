name: Testes Nero Recrutamento
on:
  push:
    branches:
      - main
      - feat/nero-validacao-id-20261115
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes Node (sem credenciais)
        run: npm test
